<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .pe-ap-meter-base {
            width: 80px;
            height: 80px;
            background: linear-gradient(to right, #d5ff9e, #19ac14, #f75212);
            border-radius: 40px;
            box-sizing: border-box;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .pe-ap-meter-base-bg {
            width: 70px;
            height: 70px;
            background-color: #fff;
            border-radius: 35px;
        }
        .pe-ap-meter-base-hidden {
            width: 80px;
            height: 40px;
            background-color: #fff;
            position: absolute;
            top: 40px;
            z-index: 2;
        }
        .pe-ap-meter-base-scale {
            width: 80px;
            height: 80px;
            position: absolute;
            z-index: 3;
        }
        .pe-ap-meter-base-cursor {
            width: 20px;
            position: absolute;
            z-index: 4;
            left: 30px;
            top: 37px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div>
        <div class="pe-ap-meter-base">
            <div class="pe-ap-meter-base-bg"></div>
            <div class="pe-ap-meter-base-hidden"></div>
            <div class="pe-ap-meter-base-scale">
                <div style="height: 6px;">A组</div>
                <div style="height: 4px;width: 50%;border-right: 1px solid black;"></div>
                <div style="text-align: center;height: 8px;">220</div>
                <div style="height: 12px;"></div>
                <div style="height: 8px;padding: 0 3px;"><span>-180</span><span style="float: right;">260-</span></div>
            </div>
            <div class="pe-ap-meter-base-cursor">
                <div style="width: 8px;border-bottom: 1px solid black;"></div>
                <div style="width: 6px;height: 6px;border-radius: 3px;background-color: #19ac14;"></div>
                <div style="width: 6px;"></div>
            </div>
        </div>
        <div class="pe-ap-meter-base">
            <div class="pe-ap-meter-base-bg"></div>
            <div class="pe-ap-meter-base-hidden"></div>
        </div>
    </div>
</body>
</html>
