<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>select</title>
    <link rel="stylesheet" href="./select.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="./select.js"></script>
</head>
<body>
    <div>
        <div id="baseDiv" style="width: 240px; height: 40px; position: relative;">
           
        </div>
        <div style="background-color: red;">don't push me</div>
        <div id='levelNavigationBar' style='position:absolute;top:5rem;left:5rem;display: flex;'>
            <div style='padding:0 0.5rem;cursor:pointer;' onclick='testClick(this)'>全院</div>
            <div id='campusNavigation' style='display:none;padding:0 0.5rem;cursor:pointer;' onclick='navigationBarClick(this)'>1</div>
            <div id='campusNavigationSelect' style='display:block;padding:0 0.5rem;cursor:pointer;' onclick='navigationBarClick(this)'></div>
            <div id='buildingNavigation' style='display:none;padding:0 0.5rem;cursor:pointer;' onclick='navigationBarClick(this)'>/2</div>
            <div id='buildingNavigationSelect' style='display:none;padding:0 0.5rem;cursor:pointer;' onclick='navigationBarClick(this)'></div>
        </div>
    </div>
</body>
<script>
    const data = [{name:'园区1',value:'value1'},{name:'园区2',value:'value2'},{name:'园区3',value:'value3'}];
    createNormalOptions('campusNavigationSelect','campusSelect',data, 'name', 'value', false);
    const data2 = [{name:'建筑1',value:'value1'},{name:'建筑2',value:'value2'},{name:'建筑3',value:'value3'}];
    createNormalOptions('buildingNavigationSelect','buildingSelect',data2, 'name', 'value', false);
    function testClick () {
        // 转到园区1
        changeLevelNavigationBar({type: 'campus', name: '园区1'});
    }
    function navigationBarClick (span) {
        console.log('-----------------navigationBarClick',span)
        const levelId = $(span).text();
        if (!levelId) {return;}
        const levelObj = app.query('#'+levelId)[0];
        if(levelObj) {
            changeToSence = levelObj;
            app.level.change(levelObj);
            changeLevelNavigationBar(levelObj);
        }
    }
    function changeLevelNavigationBar (levelObj) {
        const levelType = levelObj.type;
        console.log('-----------------changeLevelNavigationBar',levelObj)
        const levels = ['campus','building','floor','room'];
        let isShow = true;
        levels.forEach((level,index)=>{
            const div = document.querySelector('#'+level+'Navigation');
            if (div) {
                div.style.display = isShow ? 'block' : 'none';
            }
            // const select = document.querySelector('#'+level+'NavigationSelect');
            // if (select) {
            //     select.style.display = 'none';
            // }
            if (level === levelType) {
                div.innerText = levelObj.name + '/';
                const select = document.querySelector('#'+level+'NavigationSelect');
                if (select) {
                    select.style.display = 'none';
                }
                if (levels[index + 1]) {
                    const selectNext = document.querySelector('#'+levels[index + 1]+'NavigationSelect');
                    if (selectNext) {
                        selectNext.style.display = 'block';
                    }
                }
                // select.style.display = 'block';
                isShow = false;
            }
        });
    }

</script>
</html>
